[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitnext"
version = "0.1.0"
description = "Python contract-compatible implementation of GitNext v1"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "chengcuiping", email = "96756894+chengcuiping@users.noreply.github.com" },
]
maintainers = [
  { name = "chengcuiping", email = "96756894+chengcuiping@users.noreply.github.com" },
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
]

[project.urls]
Homepage = "https://github.com/chengcuiping/gitnext"
Repository = "https://github.com/chengcuiping/gitnext"
Issues = "https://github.com/chengcuiping/gitnext/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "twine>=6,<7",
]

[project.scripts]
gitnext = "gitnext.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gitnext = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra -p no:rerunfailures"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
