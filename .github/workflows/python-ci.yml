name: Python CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} / Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/audit_repository.py
      - run: python tools/secret_scan.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m mypy src
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Golden replay and evidence integrity
        run: python -m pytest tests/test_golden_conformance.py
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/audit_distribution.py dist

  fresh-distributions:
    name: Fresh wheel and sdist installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/audit_distribution.py dist
      - name: Install and smoke-test wheel
        run: |
          python -m venv "$RUNNER_TEMP/gitnext-wheel"
          "$RUNNER_TEMP/gitnext-wheel/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/gitnext-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/gitnext-wheel/bin/gitnext" --help
          "$RUNNER_TEMP/gitnext-wheel/bin/python" -c "import gitnext; assert gitnext.__version__ == '0.1.0'"
      - name: Install and smoke-test sdist
        run: |
          python -m venv "$RUNNER_TEMP/gitnext-sdist"
          "$RUNNER_TEMP/gitnext-sdist/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/gitnext-sdist/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/gitnext-sdist/bin/gitnext" --help
          "$RUNNER_TEMP/gitnext-sdist/bin/python" -c "from gitnext import FACTS_SCHEMA_VERSION; assert FACTS_SCHEMA_VERSION == '1.0.0'"

  platform-smoke:
    name: ${{ matrix.os }} install and CLI
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - run: gitnext --help
      - run: python -c "import gitnext; assert gitnext.__version__ == '0.1.0'"
