name: Publish to TestPyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Require a main branch dispatch
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::TestPyPI publishing is restricted to refs/heads/main"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Audit repository
        run: python tools/audit_repository.py

      - name: Scan for secrets
        run: python tools/secret_scan.py

      - name: Install build and test dependencies from clean source
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'

      - name: Run tests
        run: python -m pytest

      - name: Run mypy
        run: python -m mypy src

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Audit pure-Python distribution contents
        run: python tools/audit_distribution.py dist

      - name: Upload audited distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitnext-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish audited distributions
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/gitnext
    permissions:
      id-token: write
    steps:
      - name: Download audited distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gitnext-dist-${{ github.sha }}
          path: dist/

      - name: Publish to TestPyPI with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
